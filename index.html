<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1d2321;--muted:#5f6a66;--line:#d9ddd8;--accent:#7a1f2b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--card:#1d2321;--ink:#eef1ef;--muted:#9aa6a1;--line:#313a37;--accent:#c4505f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(360px,100%);display:grid;gap:12px}
h1{margin:0;font-size:1.35rem}p{margin:0;color:var(--muted);font-size:.92rem}
input{font:600 1.2rem system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;text-transform:uppercase}
button{font:600 1rem system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #18a9b8;outline-offset:2px}
#err{color:#c0392b;min-height:1.2em}
</style></head><body>

</form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(clave,silencioso){
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.i)},key,d(B.c)));
    try{localStorage.setItem('smt-clave',clave.trim().toUpperCase());}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem('smt-clave');}catch(_){}
    if(!silencioso) document.getElementById('err').textContent='Contraseña incorrecta.';
    document.getElementById('b').disabled=false;
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('b').disabled=true;document.getElementById('err').textContent='';abrir(document.getElementById('k').value,false);});
