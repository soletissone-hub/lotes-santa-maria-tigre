const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(clave,silencioso){
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.i)},key,d(B.c)));
    try{localStorage.setItem('smt-clave',clave.trim().toUpperCase());}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem('smt-clave');}catch(_){}
    if(!silencioso) document.getElementById('err').textContent='Contraseña incorrecta.';
    document.getElementById('b').disabled=false;
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('b').disabled=true;document.getElementById('err').textContent='';abrir(document.getElementById('k').value,false);});
